[package]
name = "openhub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal, self-hostable git hosting server"
license = "MIT"

[dependencies]
ammonia = "4"
anyhow = "1"
argon2 = "0.5"
askama = "0.16"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
comrak = { version = "0.55", default-features = false }
flate2 = "1"
futures-util = "0.3"
git2 = { version = "0.21", default-features = false }
hex = "0.4"
mime_guess = "2"
rand = "0.8"
russh = "0.63"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
syntect = { version = "5", default-features = false, features = ["default-themes", "html", "parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
